<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; height: 100vh; }
        #pelota {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: orange;
        }
        #boton { position: absolute; top: 10px; left: 10px; padding: 12px; z-index: 2; }
    </style>
</head>
<body>
    <button id="boton">Activar sensor</button>
    <div id="pelota"></div>

    <script>
        const pelota = document.getElementById('pelota');
        const boton = document.getElementById('boton');

        //posicion inicial en el centro
        let x = window.innerWidth / 2 - 25;
        let y = window.innerWidth / 2 - 25;

        function manejarOrientacion(evento){
            let gamma = evento.gamma; //inclinacion izquierda/derecha 
            let beta = evento.beta; //inclinacion delante/atras

            //ahora multiplico para cuanto mas gamma o beta haya....mas rapido vaya
            x = x + gamma * 0.3;
            y = y + beta * 0.3;

            //ahora creamos los limites para que no se salga de la pantalla
            if (x < 0) { x = 0; }
            if (y < 0) { y = 0; }
            if(x > window.innerWidth - 50) { 
                x = window.innerWidth - 50; 
            }
            if(y > window.innerHeight - 50) { 
                y = window.innerHeight - 50; 
            }

            pelota.style.left = x + 'px';
            pelota.style.top = y + 'px';
        }

        async function activar() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const permiso = await DeviceOrientationEvent.requestPermission();
                if (permiso !== 'granted') {
                alert('Permiso denegado');
                return;
                }
            }
            window.addEventListener('deviceorientation', manejarOrientacion);
            boton.style.display = 'none';
            }

            boton.addEventListener('click', activar);
    </script>
</body>
</html>
